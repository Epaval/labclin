{% extends "base.html" %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12">
  <div class="w-full max-w-md animate-fade-in">

    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto bg-gradient-to-br from-sky-500 to-emerald-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-sky-500/30 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Lab Clínico</h1>
      <p class="text-sm text-slate-500 mt-1">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        {% if form.errors %}
          <div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Usuario o contraseña incorrectos.
          </div>
        {% endif %}

        <div>
          <label for="id_username" class="block text-sm font-semibold text-slate-700 mb-1.5">Usuario</label>
          <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
        </div>

        <div>
          <label for="id_password" class="block text-sm font-semibold text-slate-700 mb-1.5">Contraseña</label>
          <input type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>

        <button type="submit"
                class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 rounded-lg shadow-sm hover:shadow-lg transition-all">
          Entrar
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      Sistema de Laboratorio Clínico · Acceso autorizado únicamente
    </p>
  </div>
</div>
{% endblock %}
